# CompostIQ - NGINX reverse proxy with TLS (Let's Encrypt)
# Install: /etc/nginx/sites-available/compostiq.conf, symlink into sites-enabled.
# One certificate covers the website and both subdomains:
#   certbot certonly --nginx --expand -d dashboard.compostiq.win -d api.compostiq.win \
#       -d compostiq.win -d www.compostiq.win

# --- HTTP: ACME challenges + redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name compostiq.win www.compostiq.win dashboard.compostiq.win api.compostiq.win;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Shared TLS + proxy settings (inherited by the HTTPS servers below) ---
ssl_certificate     /etc/letsencrypt/live/dashboard.compostiq.win/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/dashboard.compostiq.win/privkey.pem;

# ssl_protocols and ssl_prefer_server_ciphers are left to /etc/nginx/nginx.conf:
# Ubuntu's sets both, and setting them again here makes `nginx -t` fail.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;
client_max_body_size 10M;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 60s;

# --- Rate limit for sign-in and account requests (api.compostiq.win/auth/) ---
# Per client IP: 10 requests a minute, with a burst of 10 served at once.
# Anything over that is answered with 429 instead of reaching the API.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Devices redeeming pairing codes (api.compostiq.win/pairing/). The API also
# counts wrong codes per IP; this stops a flood before it reaches it. The
# dashboard's own pairing calls go over loopback and skip NGINX.
limit_req_zone $binary_remote_addr zone=pairing:10m rate=10r/m;
limit_req_status 429;

# --- Public website: plain HTML from the repo (website/public) ---
# No app process and no build step. The repo's website/public is bind-mounted
# at /var/www/compostiq, so `git pull` publishes a change. See website/README.md.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.compostiq.win;
    return 301 https://compostiq.win$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compostiq.win;

    root /var/www/compostiq;
    index index.html;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The pages have no inline styles or scripts, so nothing needs 'unsafe-inline'.
    # Fonts come from Google Fonts; everything else is served from here.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The live figures on the home and open data pages (assets/site.js) come
    # from the API's public endpoints. Passing them through here keeps them on
    # the same origin, so the API needs no CORS settings.
    location /api/public/ {
        proxy_pass http://127.0.0.1:8000/public/;
    }
}

# --- Dashboard (PM2: compostiq-dashboard) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.compostiq.win;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8050;
    }
}

# --- API (PM2: compostiq-api) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.compostiq.win;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /pairing/ {
        limit_req zone=pairing burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
